[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lbird-collector"
version = "0.1.0"
description = "LBird机场测评 — 开源自动化网络探测、协议解析与稳定性评估框架（纯技术学习用途）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
  "beautifulsoup4>=4.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
