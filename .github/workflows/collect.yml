name: Collect & Benchmark Snapshot

on:
  schedule:
    - cron: "0 0 * * *" # 每天北京时间 08:00 (UTC 00:00) 执行一次
  push:
    branches:
      - main
    paths:
      - "config/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector pipeline
        env:
          PYTHONPATH: src
          LBIRD_SUBSCRIPTIONS_JSON: ${{ secrets.LBIRD_SUBSCRIPTIONS_JSON }}
        run: |
          python -m lbird.cli run --config-dir config --data-dir data --readme README.md

      - name: Validate exported JSONs & secret-leak guard
        env:
          PYTHONPATH: src
        run: |
          python -m lbird.cli validate --data-dir data

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): update automated probe snapshot [skip ci]"
            git push
          fi
