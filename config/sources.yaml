# LBird 采集源与全网发现策略配置
user_agent: "LBird-Research-Bot/1.0 (+https://github.com/Will9529/LBird-Airport-Review)"

http:
  timeout_sec: 8.0
  max_concurrency: 12
  per_domain_delay_sec: 0.3
  respect_robots_txt: true

probe:
  tcp_sample_size: 16
  tcp_timeout_sec: 4.0
  enable_cli_speedtest: false

# 新闻资讯 RSS / Atom 源（用于自动更新 News 列表）
news_feeds:
  - url: "https://github.com/MetaCubeX/mihomo/releases.atom"
    category: "内核动态"
  - url: "https://github.com/SagerNet/sing-box/releases.atom"
    category: "内核动态"
  - url: "https://github.com/clash-verge-rev/clash-verge-rev/releases.atom"
    category: "客户端更新"
  - url: "https://github.com/2dust/v2rayN/releases.atom"
    category: "客户端更新"

# 公开开源机场目录订阅源（每日自动拉取并去重合并）
directory_feeds:
  - url: "https://raw.githubusercontent.com/everett7623/airport-recommendations-2026/main/data/airports.json"
    format: "everett_jsonc"
  - url: "https://raw.githubusercontent.com/gedinked/airport-recommendation/main/README.md"
    format: "markdown"
  - url: "https://raw.githubusercontent.com/jichangyyds-net/jichang-tuijian-shice/main/README.md"
    format: "markdown"
  - url: "https://raw.githubusercontent.com/clashhubs/jichang-tuijian-clash/main/README.md"
    format: "markdown"

# 公开风险与跑路预警源
risk_feeds:
  - url: "https://raw.githubusercontent.com/jichangx/airport-status/main/README.md"
    format: "jichangx_markdown"

# GitHub 自动发现新收录目录
github_discovery:
  enabled: true
  queries:
    - "机场推荐 2026 in:name,description"
    - "airport-recommendation in:name"
  max_repos_per_query: 3
  max_total_targets: 200
